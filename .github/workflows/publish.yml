name: Publish

# Triggered by publishing a GitHub release, so the tag, the release notes and the npm
# version are decided in one place. workflow_dispatch is the manual escape hatch.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate the run so publishing can carry protection rules of its own. npm's trusted
    # publisher must name this same environment, or the OIDC claim will not match.
    environment: publish
    permissions:
      contents: read
      # npm Trusted Publishing: GitHub mints a short-lived id-token per run and npm
      # verifies it against the package's trusted publisher. There is no NPM_TOKEN.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Publishing an unformatted, failing or unbuildable package is worse than not
      # publishing, and a release can be cut from a commit CI never saw.
      - name: Verify
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:coverage

      - name: Build
        run: pnpm build

      # Refuse to publish a version that is already on npm rather than failing halfway
      # through with a registry error, and refuse to ship one with no notes — the version
      # number is the release, so it does not get to arrive undocumented.
      - name: Check the version is new and has notes
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          NOTES="release-notes/$VERSION.md"

          if [ ! -f "$NOTES" ]; then
            echo "Missing $NOTES — every released version needs its notes file."
            exit 1
          fi
          if ! head -1 "$NOTES" | grep -qF "## $NAME@$VERSION"; then
            echo "$NOTES must start with '## $NAME@$VERSION'."
            exit 1
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published."
            exit 1
          fi
          echo "Publishing $NAME@$VERSION."

      # Auth is the id-token minted above. NODE_AUTH_TOKEN must stay unset — even an
      # empty value makes pnpm use token auth instead of falling back to OIDC. Provenance
      # is produced by Trusted Publishing itself, so --provenance is not passed.
      # --no-git-checks because the release checkout is a detached HEAD.
      - name: Publish
        run: pnpm publish --no-git-checks

      - name: Summarise
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "### 📦 Published \`oxfmt-quick@$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/oxfmt-quick/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
