name: Publish

# Publishes to npm via Trusted Publishing (OIDC), then cuts the GitHub Release. Manual
# dispatch only — never from a push, a merge, or CI finishing. A release is a deliberate
# act with required, human-written notes; auth is a short-lived id-token minted per run
# and verified against the npm trusted publisher, so there is no long-lived token.
#
# Deliberately not triggered by `release: published` — this workflow *creates* the
# release, so that trigger would be circular.

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # main-only: a release always comes off the CI-passed main branch, even though the
    # dispatch UI lets you pick any ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: publish
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing (no NPM_TOKEN)
      contents: write # create the GitHub Release + tag
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The version is the release, so refuse one that is undocumented before doing any
      # work — and read it once here for every later step.
      - name: Resolve the version and check its notes
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          NOTES="release-notes/$VERSION.md"

          test -f "$NOTES" \
            || { echo "::error::Missing release notes: $NOTES"; exit 1; }
          head -1 "$NOTES" | grep -qF "## $NAME@$VERSION" \
            || { echo "::error::$NOTES must start with '## $NAME@$VERSION'"; exit 1; }

          {
            echo "PKG_NAME=$NAME"
            echo "PKG_VERSION=$VERSION"
            echo "NOTES_FILE=$NOTES"
          } >> "$GITHUB_ENV"

      - name: Read Node.js version from .nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      # The Node line matters for more than the build: trusted publishing is implemented
      # in the npm CLI, and only npm 11+ can perform the OIDC exchange. Node 22 still
      # bundles npm 10, which publishes anonymously — reported by the registry as a 404 on
      # the package rather than as an auth error. .nvmrc pins a line new enough to avoid it.
      #
      # No registry-url, deliberately. It makes setup-node write an .npmrc carrying
      # `always-auth` and `_authToken=${NODE_AUTH_TOKEN}`; with no such token to expand,
      # npm reads that literal placeholder as a credential, considers auth settled, and
      # never attempts the OIDC exchange — publishing anonymously and 404ing on a package
      # it does not own. The default registry is npmjs.org anyway, so nothing is lost.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Both ways this can silently fall back to an anonymous publish are checked here,
      # because the registry reports that as a 404 on the package — a misleading error, and
      # one that only arrives after the whole run has been spent. Fail in seconds instead.
      - name: Preflight the OIDC publish
        run: |
          VERSION=$(npm --version)
          if [ "$(printf '%s\n11.5.1\n' "$VERSION" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $VERSION cannot do trusted publishing; 11.5.1 or newer is required."
            exit 1
          fi

          # Read the npmrc rather than asking npm: it refuses to print auth values at all
          # ("the option is protected"), and does so with a non-zero exit.
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ] && grep -q '_authToken' "$NPMRC"; then
            echo "::error::$NPMRC configures an auth token, so the OIDC exchange would be skipped."
            echo "::error::Usually setup-node's registry-url input — remove it."
            exit 1
          fi

          echo "npm $VERSION, no auth token in ${NPMRC} — OIDC it is."

      # --ignore-scripts, as everywhere in CI/CD: no lifecycle script runs at install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Publishing something unformatted, failing or unbuildable is worse than not
      # publishing, and a dispatch can be run against a commit CI never saw.
      - name: Verify
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:coverage

      - name: Build
        run: pnpm build

      # Publish via Trusted Publishing (OIDC). Auth comes from the id-token minted above —
      # there is no NPM_TOKEN, and NODE_AUTH_TOKEN must stay unset, because even an empty
      # value makes pnpm use token auth instead of falling back to OIDC. A version already
      # on the registry is skipped rather than failed, so a rerun can carry on to the
      # release step below instead of dying on a republish.
      - name: Publish
        run: |
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "⏭️ \`$PKG_NAME@$PKG_VERSION\` already on npm — skipped (bump the version to release)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm publish --no-git-checks
          echo "### 📦 Published \`$PKG_NAME@$PKG_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/$PKG_NAME/v/$PKG_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Published::$PKG_NAME@$PKG_VERSION"

      # Gated on the release's existence rather than on whether this run published, so a
      # rerun can repair a missing release after a successful publish. Runs even if the
      # step above failed (`!cancelled()`); a version that never reached npm is skipped
      # rather than released. Notes come from the in-repo file verbatim via --notes-file.
      - name: Create the GitHub Release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$PKG_VERSION"
          if ! npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "⏭️ \`$TAG\` is not on npm — no GitHub Release created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⏭️ GitHub Release \`$TAG\` already exists — skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" --title "$PKG_NAME@$PKG_VERSION" --notes-file "$NOTES_FILE"
          echo "### 🏷️ Released \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
